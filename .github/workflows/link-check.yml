name: Link check

on:
  schedule:
    # Every Monday at 06:00 UTC. A failure here means a manufacturer or KBA changed their site (a
    # source page moved, its markup changed shape, or a link stopped resolving) - not that the app's
    # own logic regressed, since nothing about the code changes between scheduled runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-links:
    name: Check rescue-card and stock sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Brands GitHub-hosted runners can't reach - see the comment on the dry-run step below. Kept in
      # one place for that step and the probe step after it.
      EXCLUDED_BRANDS: bentley fiat fiatprofessional abarth alfaromeo lancia jeep maserati volvo tesla suzuki

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Discovery-only (no PDF downloads) against every brand source currently registered in
      # CompositionRoot - `--brand all` iterates the Brand enum, so a newly added brand is covered
      # automatically without editing this workflow. This exercises each brand's real overview/model
      # page URLs exactly like a normal `fetch rescue-cards` run would (same HTTP client, same
      # per-host politeness delays), just without pulling every PDF on a weekly schedule.
      #
      # With every brand running in parallel this takes about 5 minutes (measured 2026-09-29): the
      # slowest single source is Ford, whose discovery queries the fordserviceinfo.com lookup once
      # per European vehicle line and model year (~210 requests at the 1 request/second per-host
      # politeness delay). Hosts are rate-limited independently, so more brands don't add up.
      #
      # Exit code is non-zero only for an *unexpected* discovery failure (see
      # RunSummaryPrinter.HasUnexpectedFailures) - a not-yet-implemented brand stub or Cupra AT's
      # known auth-gateway redirect doesn't fail this job, only a source page that's actually
      # moved/broken does.
      #
      # Excluded brands answer every request from GitHub-hosted runners with 403 (tested 2026-09-30
      # on ubuntu-latest and 2026-10-06 on windows-latest - a Windows runner doesn't help). Two
      # different blocks, see the README's "Known limitations": the Akamai sites (Bentley, Fiat,
      # Fiat Professional, Abarth, Alfa Romeo, Lancia, Jeep, Maserati, Volvo, Tesla) also reject
      # .NET's Linux TLS client from any network, and additionally GitHub's IP ranges; Suzuki only
      # blocks GitHub's IP ranges. No code change fixes either, so check these brands with a local
      # dry run on Windows instead. The probe step below reports when one becomes reachable again.
      - name: Check rescue-card sources (dry run, all brands reachable from CI)
        run: >
          dotnet run --project src/Rettungskarten.Cli --no-build --configuration Release --
          fetch rescue-cards --brand all --dry-run --output "${{ runner.temp }}/rescue-cards"
          --exclude-brands ${{ env.EXCLUDED_BRANDS }}

      # Informational only (never fails the job): tries each excluded brand on its own. One that
      # passes is reachable from GitHub's runners again and gets a warning annotation asking to take it
      # off EXCLUDED_BRANDS, so the exclusion list can't silently outlive its reason. One that still
      # fails is only logged - its page could have moved too, which is what the local dry run is for.
      - name: Probe excluded brands (informational)
        continue-on-error: true
        run: |
          for brand in $EXCLUDED_BRANDS; do
            if dotnet run --project src/Rettungskarten.Cli --no-build --configuration Release -- \
                fetch rescue-cards --brand "$brand" --dry-run --output "${{ runner.temp }}/excluded-$brand" > /dev/null 2>&1; then
              echo "::warning::$brand is reachable from GitHub's runners again - remove it from EXCLUDED_BRANDS in link-check.yml"
            else
              echo "$brand: still not reachable from GitHub's runners"
            fi
          done

      # Discovery (even in --dry-run) already populates BodyType/FuelType/Doors from each source's
      # free text, so this runs straight against the previous step's output with no extra downloads.
      # Catches the class of bug a "did discovery return results" check can't - see
      # DataQualityChecker for what's checked and the real Audi filename-parsing bug that motivated it.
      - name: Check rescue-card data quality
        run: >
          dotnet run --project src/Rettungskarten.Cli --no-build --configuration Release --
          inspect quality --rescue-cards-path "${{ runner.temp }}/rescue-cards"

      # Resolves and downloads the current year's KBA FZ12 stock file. KbaVehicleStockSource scrapes
      # the real download link (including its unpredictable `v=` query parameter) from the KBA
      # product page rather than hardcoding it, so this also catches KBA restructuring that page.
      - name: Check vehicle stock source (current year)
        run: >
          dotnet run --project src/Rettungskarten.Cli --no-build --configuration Release --
          fetch stock --year "$(date -u +%Y)" --output "${{ runner.temp }}/stock"
